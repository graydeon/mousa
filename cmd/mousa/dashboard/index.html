<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mousa</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
	<h1>Mousa</h1>
	<p id="link" class="link" role="status"><span class="lamp"></span><span id="link-text">Connecting</span></p>
	<form id="key-form" class="key" hidden>
		<input id="key" type="password" autocomplete="off" spellcheck="false" aria-label="Token" placeholder="Token">
		<button type="submit">Open</button>
	</form>
</header>

<p id="alert" class="alert" hidden></p>

<section class="flow" aria-label="Pipeline">
	<div class="node shared" data-stage="receive"><b>Arrive</b><i></i></div>
	<div class="node shared" data-stage="admission"><b>Log</b><i></i></div>
	<div class="node shared" data-stage="access"><b>Permit</b><i></i></div>

	<p class="lane" data-lane="query"><b>Search</b></p>
	<div class="node" data-stage="retrieval"><b>Find</b><i></i></div>
	<div class="node" data-stage="rank"><b>Rank</b><i></i></div>
	<div class="node" data-stage="pack"><b>Pack</b><i></i></div>

	<p class="lane" data-lane="note"><b>Remember</b></p>
	<div class="node" data-stage="citations"><b>Cite</b><i></i></div>
	<div class="node" data-stage="note"><b>Write</b><i></i></div>

	<p class="lane" data-lane="document"><b>Document</b></p>
	<div class="node" data-stage="represent"><b>Split</b><i></i></div>
	<div class="node" data-stage="index"><b>Index</b><i></i></div>

	<div class="node shared tail" data-stage="commit"><b>Save</b><i></i></div>
	<div class="node shared tail" data-stage="response"><b>Reply</b><i></i></div>
</section>

<section class="agents" aria-label="Agents">
	<h2>Agents</h2>
	<ul id="agents"></ul>
</section>

<section class="recent" aria-label="Recent requests">
	<h2>Recent</h2>
	<p id="quiet" class="quiet">Nothing yet.</p>
	<ol id="recent"></ol>
</section>

<aside id="detail" class="detail" aria-live="polite" hidden></aside>

<script src="/app.js"></script>
</body>
</html>
