<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mousa</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
	<h1>Mousa</h1>
	<p id="link" class="link" role="status"><span class="lamp"></span><span id="link-text">Connecting</span></p>
	<form id="key-form" class="key" hidden>
		<input id="key" type="password" autocomplete="off" spellcheck="false" aria-label="Token" placeholder="Token">
		<button type="submit">Open</button>
	</form>
	<dl class="stats" aria-label="Last 100 requests">
		<div><dt>Searches</dt><dd id="stat-query">0</dd></div>
		<div><dt>Notes</dt><dd id="stat-note">0</dd></div>
		<div><dt>Documents</dt><dd id="stat-document">0</dd></div>
		<div><dt>Refused</dt><dd id="stat-refused">0</dd></div>
		<div><dt>Typical</dt><dd id="stat-typical">–</dd></div>
	</dl>
</header>

<p id="alert" class="alert" hidden></p>

<div class="page">
	<main>
		<section class="panel" aria-label="Pipeline">
			<header><h2>Pipeline</h2><p id="busy" class="hint">Idle</p></header>
			<div id="flow" class="flow"></div>
		</section>

		<section class="panel" aria-label="Requests">
			<header><h2>Requests</h2></header>
			<table class="log">
				<thead><tr><th>Time</th><th>Agent</th><th>Did</th><th>Text</th><th>Result</th><th class="num">Took</th></tr></thead>
				<tbody id="log"></tbody>
			</table>
			<p id="quiet" class="hint pad">Nothing yet.</p>
		</section>
	</main>

	<aside>
		<section class="panel" aria-label="Agents">
			<header><h2>Agents</h2></header>
			<ul id="agents" class="agents"></ul>
		</section>

		<section class="panel inspector" aria-label="Request" aria-live="polite">
			<header><h2>Request</h2><button id="follow" type="button" hidden>Follow live</button></header>
			<div id="pick" class="pick"><p class="hint">Nothing yet.</p></div>
		</section>
	</aside>
</div>

<script src="/app.js"></script>
</body>
</html>
